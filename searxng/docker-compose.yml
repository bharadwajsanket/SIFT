name: sift

services:
  sift-web:
    container_name: sift-web
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SIFT_PORT:-3000}:3000"
    environment:
      - SEARXNG_URL=http://searxng-core:8080
      - SIFT_LLM_ENABLED=${SIFT_LLM_ENABLED:-true}
      - SIFT_LLM_URL=${SIFT_LLM_URL:-http://llama-server:8080}
      - SIFT_LLM_MODEL=${SIFT_LLM_MODEL:-/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
    depends_on:
      - core

  llama-server:
    container_name: sift-llama-server
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes:
      - ../models:/models:ro
    command: >
      -m ${SIFT_LLM_MODEL:-/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8080
      -t ${SIFT_LLM_THREADS:-4}
      -c ${SIFT_LLM_CTX_SIZE:-2048}
      -n ${SIFT_LLM_N_PREDICT:-512}
      --parallel 1
      --cont-batching

  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-2026.8.29-d226b78bc}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    dns:
      - 192.168.1.1
      - 1.1.1.1
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change_this_secret_key_in_production}
    depends_on:
      - valkey

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
