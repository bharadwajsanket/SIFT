    <circle cx="10.5" cy="12" r="1.1" />
    <circle cx="4.5" cy="16" r="0.85" />
    <circle cx="8.5" cy="16" r="1.3" />
    <circle cx="12.5" cy="16" r="1.1" />
    <circle cx="6" cy="23" r="0.9" />
    <circle cx="10.5" cy="20" r="1.1" />
    <circle cx="8" cy="6.5" r="0.75" />
    <circle cx="8" cy="25.5" r="0.75" />
  </g>

  <!-- Filter Chevron (Center) -->
  <path
    d="M15.5 7.5L22 16L15.5 24.5"
    stroke="url(#sift-fav-grad)"
    stroke-width="2.5"
    stroke-linecap="round"
