<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0d0e12"/>
  <defs>
    <linearGradient id="sift-fav-grad" x1="15" y1="7" x2="22" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="100%" stop-color="#6c5ce7" />
    </linearGradient>
    <linearGradient id="sift-dot-grad" x1="25" y1="14" x2="29" y2="18" gradientUnits="userSpaceOnUse">
